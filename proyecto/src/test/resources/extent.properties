extent.reporter.spark.start=true
extent.reporter.spark.out=reports/ExtentSpark.html
extent.reporter.spark.config=src/test/resources/extent-config.xml

screenshot.dir=screenshots/
screenshot.rel.path=../screenshots/

extent.reporter.pdf.start=false
extent.reporter.json.start=false
extent.reporter.html.start=false

// ===== ARCHIVO 5: extent-config.xml =====
// Ubicación: src/test/resources/extent-config.xml

<?xml version="1.0" encoding="UTF-8"?>
<extentreports>
    <configuration>
        <!-- Configuración del reporte -->
        <theme>standard</theme>
        
        <!-- Información del documento -->
        <documentTitle>Proyecto Automatizacion Test Report</documentTitle>
        <reportName>Automation Test Results</reportName>
        
        <!-- Configuración del timestamp -->
        <timeStampFormat>MMM dd, yyyy HH:mm:ss</timeStampFormat>
        
        <!-- Scripts personalizados -->
        <scripts>
            <![CDATA[
                $(document).ready(function() {
                    $('#test-view-charts').prepend('<div class="card-panel"><h5>Proyecto Automatizacion System</h5><p>Test Automation Report - Login Module</p></div>');
                });
            ]]>
        </scripts>
        
        <!-- Estilos personalizados -->
        <styles>
            <![CDATA[
                .brand-logo { 
                    color: #2196F3 !important; 
                    font-weight: bold; 
                }
                .card-panel h5 { 
                    color: #1976D2; 
                    margin-bottom: 10px; 
                }
            ]]>
        </styles>
    </configuration>
</extentreports>
